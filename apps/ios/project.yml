name: OpenBoard
options:
  bundleIdPrefix: co.thevibecompany
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: K28B69CWQ7
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  OpenBoard:
    type: application
    platform: iOS
    sources:
      - path: OpenBoard
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: OpenBoard
        PRODUCT_BUNDLE_IDENTIFIER: co.thevibecompany.openboard
        INFOPLIST_KEY_CFBundleDisplayName: OpenBoard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "OpenBoard AppStore"
  OpenBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenBoardTests
    dependencies:
      - target: OpenBoard
    settings:
      base:
        PRODUCT_NAME: OpenBoardTests
        PRODUCT_BUNDLE_IDENTIFIER: co.thevibecompany.openboard.tests
        CODE_SIGN_STYLE: Automatic
schemes:
  OpenBoard:
    build:
      targets:
        OpenBoard: all
        OpenBoardTests: [test]
    test:
      targets:
        - OpenBoardTests
    archive:
      config: Release
