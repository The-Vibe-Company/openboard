services:
  openboard:
    image: ghcr.io/the-vibe-company/openboard:${OPENBOARD_IMAGE_TAG:?Set OPENBOARD_IMAGE_TAG to a published tag}
    ports:
      - "8787:8787"
    environment:
      OPENBOARD_SECRET_KEY_FILE: /run/secrets/openboard_key
    volumes:
      - openboard:/data
    secrets:
      - openboard_key

secrets:
  openboard_key:
    file: ./openboard-key.txt

volumes:
  openboard:
