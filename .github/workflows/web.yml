name: Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/sdk/**'
      - 'packages/contract/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.3

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBOARD_TEST_DATABASE_URL: postgres://openboard:openboard@127.0.0.1:15432/openboard
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: openboard
          POSTGRES_PASSWORD: openboard
          POSTGRES_DB: openboard
        ports:
          - "15432:5432"
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U openboard -d openboard"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web --bun playwright install-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun run --cwd apps/web --bun playwright install chromium
      - run: bun run e2e --project local --project hosted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: screenshots
          path: apps/web/test-results/**/screenshots/*.png
          if-no-files-found: error
          overwrite: true
