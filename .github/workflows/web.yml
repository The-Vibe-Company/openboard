name: Web

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/sdk/**'
      - 'packages/contract/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBOARD_TEST_DATABASE_URL: postgres://openboard:openboard@127.0.0.1:55432/openboard
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: openboard
          POSTGRES_PASSWORD: openboard
          POSTGRES_DB: openboard
        ports:
          - "55432:5432"
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U openboard -d openboard"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web --bun playwright install --with-deps chromium
      - run: bun run e2e --project local --project hosted
