name: Release

on:
  push:
    branches: [main]

# One run at a time, so two merges never update Railway together. A newer pending run replaces an older
# pending one (GitHub keeps one waiting run per group): staging always ends on the latest merge.
concurrency:
  group: release-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2
  IMAGE: ghcr.io/the-vibe-company/openboard
  DEPLOYMENT_TAG: main-${{ github.sha }}

jobs:
  publish:
    name: Build and publish commit image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Explain skipped staging deploy
        if: vars.STAGING_DEPLOY != 'on'
        run: |
          echo 'Staging deployment skipped because the repository variable `STAGING_DEPLOY` is not set to `on`.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Linux binary and image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:${DEPLOYMENT_TAG}" .
      - name: Push commit image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${DEPLOYMENT_TAG}"

  staging:
    name: Deploy staging
    needs: publish
    if: vars.STAGING_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Check Railway credential
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo 'missing RAILWAY_TOKEN' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Deploy and verify staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: bun scripts/release/railway-deploy.ts staging "$DEPLOYMENT_TAG"
