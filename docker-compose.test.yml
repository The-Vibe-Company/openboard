# Postgres for `bun run verify:pg` (docs/codebase.md 6.2).
# Same major version as production (Postgres 17); the CI Postgres service container (ticket 35) must use this tag.
# The healthcheck uses TCP: during first-start init the server listens on its Unix socket only.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: openboard
      POSTGRES_PASSWORD: openboard
      POSTGRES_DB: openboard
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openboard -d openboard"]
      interval: 1s
      timeout: 3s
      retries: 30
