# Postgres for `bun run verify:pg` (docs/codebase.md 6.2).
# Same major version as production; keep in step with the service container in .github/workflows/ci.yml.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: openboard
      POSTGRES_PASSWORD: openboard
      POSTGRES_DB: openboard
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openboard -d openboard"]
      interval: 1s
      timeout: 3s
      retries: 30
